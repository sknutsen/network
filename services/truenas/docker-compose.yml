# Deploy on TrueNAS (10.10.30.20). Datasets under tank/services/.
# Caddy runs on janus (NixOS), not here. Publish backend ports on this
# host IP only — nftables drops forwarded 30142/9091/30041/30103 so clients
# cannot skip Caddy. Janus Caddy uses OUTPUT (not forward).
#
# Blocky binds 10.10.30.21 — add a /32 alias on the TrueNAS VLAN 30 NIC
# (gateway 10.10.30.1) before starting this stack.
#
# Authelia: copy services/authelia/.env.example → .env and
# users_database.yml.example → users_database.yml, then generate hashes.
# Immich: copy services/immich/.env.example → .env (DB_PASSWORD).

services:
  authelia:
    image: authelia/authelia:4
    restart: unless-stopped
    env_file:
      - ../authelia/.env
    # Live Authelia is a TrueNAS App on 10.10.30.20:9091 (Caddy). Do not
    # also publish this port from compose.
    ports:
      - "10.10.30.20:9091:9091"
    volumes:
      - ../authelia/configuration.yml:/config/configuration.yml:ro
      - ../authelia/users_database.yml:/config/users_database.yml:ro
      - /mnt/tank/services/authelia/data:/data
    networks:
      - edge

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    environment:
      TZ: Europe/Oslo
    # Live HA is a TrueNAS App on 10.10.30.20:30103 (Caddy). Do not also
    # publish this port from compose. Container listen port is still 8123.
    ports:
      - "10.10.30.20:30103:8123"
    volumes:
      - /mnt/tank/services/homeassistant/config:/config
    networks:
      - edge
    # Traffic to IoT exits via TrueNAS 10.10.30.20 (nftables servers→IoT).

  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    restart: unless-stopped
    environment:
      # Stage 5 internal. At Stage 7 switch ROOT_URL/SSH_DOMAIN to https://code.zdk.no
      - FORGEJO__server__ROOT_URL=https://code.lab.zdk.no
      - FORGEJO__server__SSH_DOMAIN=code.lab.zdk.no
      - FORGEJO__server__SSH_PORT=30143
    volumes:
      - /mnt/tank/services/forgejo/data:/data
      - /mnt/tank/services/forgejo/config:/etc/gitea
    networks:
      - edge
    # Live Forgejo is a TrueNAS App on 10.10.30.20:30142 (UI) and :30143
    # (SSH). Do not also publish those ports from compose.
    ports:
      - "10.10.30.20:30142:3000"
      - "10.10.30.20:30143:22"

  # Immich — keep in sync with
  # https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
  # Live Immich is a TrueNAS App on 10.10.30.20:30041. Keep a single
  # listener; do not start a second stack on that port.
  # Copy services/immich/.env.example → services/immich/.env first.
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3
    restart: unless-stopped
    env_file:
      - ../immich/.env
    environment:
      TZ: Europe/Oslo
      DB_HOSTNAME: database
      REDIS_HOSTNAME: redis
    # TrueNAS App host port (Caddy → 30041). Container still listens on 2283.
    ports:
      - "10.10.30.20:30041:2283"
    volumes:
      - /mnt/tank/services/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
    networks:
      - edge
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3
    restart: unless-stopped
    env_file:
      - ../immich/.env
    volumes:
      - immich-model-cache:/cache
    networks:
      - edge
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks:
      - edge

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    env_file:
      - ../immich/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /mnt/tank/services/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - edge
    healthcheck:
      disable: false

  blocky:
    image: ghcr.io/0xerr0r/blocky:v0.26
    restart: unless-stopped
    ports:
      - "10.10.30.21:53:53/udp"
      - "10.10.30.21:53:53/tcp"
    volumes:
      - ../dns/blocky.yml:/app/config.yml:ro
      - ../dns/iot-lab-deny.txt:/app/iot-lab-deny.txt:ro
    networks:
      - edge

  # Stub: do not start until Loki answers. Then:
  #   docker compose --profile logging up -d
  promtail:
    image: grafana/promtail:3.4
    restart: unless-stopped
    profiles:
      - logging
    volumes:
      - ../promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/tank/services/promtail:/positions
    command:
      - -config.file=/etc/promtail/config.yml
    networks:
      - edge

volumes:
  immich-model-cache:

networks:
  edge:
    driver: bridge
