# Blocky — IoT DNS (10.10.30.21). Upstream is Unbound on the servers gateway.
# Flip homelab.router.enableBlocky only after this answers on :53.
upstream:
  default:
    - 10.10.30.1

bootstrapDns:
  - tcp+udp:1.1.1.1

connectIPVersion: v4

ports:
  dns: 53
  http: 4000

# IoT clients (incl. the TV) should hit Caddy on the VLAN gateway. UniFi
# isolation often blocks 10.10.30.1 the same way guest cannot; guest DNS
# already maps jellyfin to 10.10.50.1. customDNS is answered before the
# lab denylist, so this does not depend on allowlists loading.
customDNS:
  customTTL: 1h
  mapping:
    jellyfin.lab.zdk.no: 10.10.40.1
    ha.lab.zdk.no: 10.10.40.1

blocking:
  # Same group as the lab denylist so the household allow wins if a name
  # is not in customDNS (Unbound still has 10.10.30.1).
  allowlists:
    lab:
      - /app/iot-lab-allow.txt
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    lab:
      - /app/iot-lab-deny.txt
  clientGroupsBlock:
    default:
      - ads
      - lab
  blockType: nxDomain

# DoT :853 omitted until Blocky has a cert (firewall DNATs 853; fail closed).

# Prometheus scrapes 10.10.30.21:4000/metrics from k8s (VLAN 30).
# TrueNAS Custom App must publish host port 4000 on the .21 alias.
prometheus:
  enable: true
  path: /metrics
