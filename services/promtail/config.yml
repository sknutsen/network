# TrueNAS Docker logs → Loki (MetalLB 10.10.30.101:3100).
# Start only this service:
#   docker compose --profile logging up -d promtail
# Do not put the Loki push API behind Authelia.
#
# docker_sd sees every container on the host socket (ix-apps included).
# Loki rejects samples older than 7d; drop those here so first-run
# Mailcow history does not 400 the whole batch.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://10.10.30.101:3100/loki/api/v1/push

scrape_configs:
  - job_name: truenas-compose
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    pipeline_stages:
      - drop:
          older_than: 24h
          drop_counter_reason: too_old
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: ".*promtail.*"
        action: drop
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - replacement: truenas
        target_label: host
      - replacement: homelab
        target_label: job
