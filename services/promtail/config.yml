# Promtail stub — TrueNAS compose logs → Loki in k8s.
# Enable: docker compose --profile logging up -d
# after Loki is reachable. Do not put the Loki push API behind Authelia.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  # Replace when kube-prometheus-stack exposes Loki on VLAN 30
  # (dedicated MetalLB IP or Traefik PathPrefix, not Caddy+Authelia).
  - url: http://10.10.30.101:3100/loki/api/v1/push

scrape_configs:
  - job_name: truenas-compose
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - replacement: truenas
        target_label: host
      - replacement: homelab
        target_label: job
