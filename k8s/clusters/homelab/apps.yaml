apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  dependsOn:
    - name: infra-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/clusters/homelab/apps
