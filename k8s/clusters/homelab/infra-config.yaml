# MetalLB pool, Loki VLAN Service, IngressRoutes — needs CRDs from infra-core.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-config
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: infra-core
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/clusters/homelab/infra/config
