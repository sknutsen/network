apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - sources.yaml
  - metallb.yaml
  - longhorn.yaml
  - traefik.yaml
  - grafana-admin.secret.yaml
  - kube-prometheus-stack.yaml
  - loki.yaml
  - capacitor.yaml

configMapGenerator:
  - name: grafana-dashboard-network
    namespace: monitoring
    files:
      - network-overview.json=dashboards/network-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Network
