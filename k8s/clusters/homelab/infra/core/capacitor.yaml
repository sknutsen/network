# In-cluster Capacitor (gimlet-io OCI). Laptop "Capacitor Next" is optional
# and does not replace this — Caddy serves capacitor.lab.zdk.no + Authelia.
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: capacitor
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/gimlet-io/capacitor-manifests
  ref:
    semver: ">=0.1.0"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capacitor
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  targetNamespace: flux-system
  path: ./
  sourceRef:
    kind: OCIRepository
    name: capacitor
