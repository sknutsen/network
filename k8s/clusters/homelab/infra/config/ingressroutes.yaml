# Caddy forwards Host to Traefik 10.10.30.100:80. TLS stays on janus.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.lab.zdk.no`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: capacitor
  namespace: flux-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`capacitor.lab.zdk.no`)
      kind: Rule
      services:
        - name: capacitor
          port: 9000
