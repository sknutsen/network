# HelmRepos + HelmReleases + Capacitor OCI. Applied after flux bootstrap.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-core
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/clusters/homelab/infra/core
