<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>net — HTML viewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.25rem;
      line-height: 1.5;
    }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
    }
    pre {
      background: #f4f4f4;
      padding: 0.85rem 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>HTML viewer</h1>
  <p>
    Markdown in <code>docs/</code> is the source of truth.
    Generate a standalone HTML page (no HTTP server) from the repo root:
  </p>
  <pre>python3 scripts/generate-viewer.py --open</pre>
  <p>
    That writes <code>docs/generated/index.html</code> (gitignored) and opens it.
    If you already generated it,
    <a href="generated/index.html">open the viewer</a>.
  </p>
</body>
</html>
